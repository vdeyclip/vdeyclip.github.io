<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videy Player - Premium Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #f8fafc; 
            font-family: 'Inter', sans-serif; 
        }
        .blue-gradient-bg {
            background: radial-gradient(circle at top right, #dbeafe 0%, transparent 40%),
                        radial-gradient(circle at bottom left, #eff6ff 0%, transparent 40%);
        }
        .player-container {
            background: #0f172a; /* Deep dark blue */
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(37, 99, 235, 0.2);
        }
        .progress-bar-bg { height: 4px; background: rgba(255,255,255,0.1); width: 100%; position: absolute; bottom: 0; left: 0; }
        .progress-fill { height: 100%; background: #2563eb; width: 45%; transition: width 0.3s; }
    </style>
</head>
<body class="flex flex-col min-h-screen blue-gradient-bg">

    <!-- Header Section -->
    <header class="p-6 flex justify-between items-center bg-white/50 backdrop-blur-md border-b border-blue-50">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                <i class="fas fa-play text-white text-xs ml-0.5"></i>
            </div>
            <span class="text-sm font-bold tracking-tight text-slate-800 uppercase">Videy<span class="text-blue-600">Player</span></span>
        </div>
        <div class="flex gap-2">
            <span class="text-[10px] font-bold bg-blue-100 text-blue-700 px-3 py-1 rounded-full uppercase tracking-wider">4K Ultra HD</span>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4">
        <!-- Player Area -->
        <div id="playerArea" class="player-container aspect-video w-full max-w-4xl rounded-[2.5rem] overflow-hidden group cursor-pointer border-4 border-white relative">
            
            <!-- Video Overlay -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-60"></div>
            
            <!-- Play Button (PERFECTLY CENTERED) -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-30">
                <div class="w-20 h-20 sm:w-24 sm:h-24 bg-blue-600/90 text-white rounded-full flex items-center justify-center shadow-2xl backdrop-blur-sm transform group-hover:scale-110 transition-all duration-500 border-4 border-white/20">
                    <i class="fas fa-play text-3xl ml-1.5"></i>
                </div>
            </div>

            <!-- Player Controls (Visual Only) -->
            <div class="absolute bottom-8 left-8 right-8 z-20 flex justify-between items-center text-white/90 font-medium text-xs">
                <div class="flex items-center gap-6">
                    <span class="flex items-center gap-3">
                        <i class="fas fa-pause"></i> 
                        <span class="tabular-nums">08:42 / 18:05</span>
                    </span>
                    <span class="hidden sm:flex items-center gap-2 opacity-70">
                        <i class="fas fa-volume-up"></i> 85%
                    </span>
                </div>
                <div class="flex items-center gap-5 opacity-70">
                    <i class="fas fa-closed-captioning text-lg"></i>
                    <i class="fas fa-cog text-lg"></i>
                    <i class="fas fa-expand text-lg"></i>
                </div>
            </div>

            <!-- Fake Progress Bar -->
            <div class="progress-bar-bg">
                <div class="progress-fill relative">
                    <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow-lg"></div>
                </div>
            </div>
        </div>

        <!-- Text Content -->
        <div class="mt-10 text-center max-w-md">
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Playback Verification</h2>
            <p class="text-slate-500 text-sm leading-relaxed">
                Almost there! Please <span class="text-blue-600 font-semibold">click the player above</span> to verify your connection and start the premium stream.
            </p>
            
            <div class="mt-6 flex justify-center items-center gap-2 text-[11px] text-slate-400 uppercase tracking-widest font-bold">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span>
                Server: Singapore #01 - Active
            </div>
        </div>
    </main>

    <footer class="p-6 text-center text-slate-400 text-[10px]">
        &copy; 2024 Videy Premium Network. All rights reserved.
    </footer>

    <script>
        const domains = [
            'https://asupan-link-videy.blogspot.com/',
            'https://loadads2.blogspot.com/',
            'https://asupan-link-videy.blogspot.com/',
            'https://loadads2.blogspot.com/'
        ];

        document.getElementById('playerArea').addEventListener('click', function() {
            const randomUrl = domains[Math.floor(Math.random() * domains.length)];
            window.open(randomUrl, '_blank');
            window.location.href = 'https://loadads2.blogspot.com/';
        });
    </script>

    <!-- Histats -->
    <script type='text/javascript'>
        var _Hasync=_Hasync||[];
        _Hasync.push(['Histats.start', '1,4912344,4,0,0,0,00010000']);
        _Hasync.push(['Histats.fasi', '1']);
        _Hasync.push(['Histats.track_hits', '']);
        (function(){
            var hs = document.createElement('script'); hs.async = true;
            hs.src = '//s10.histats.com/js15_as.js';
            (document.head||document.body).appendChild(hs);
        })();
    </script>
</body>
</html>
